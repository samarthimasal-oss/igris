appId: dev.igris.assistant
productName: IGRIS
copyright: Copyright © 2026 Samarth
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: IGRIS-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IGRIS
  uninstallDisplayName: IGRIS
extraMetadata:
  name: igris
